services:
  redis:
    image: public.ecr.aws/docker/library/redis:7.2-alpine
    container_name: bastion-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - bastion-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    container_name: bastion-redisinsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: Bastion Redis
      RI_REDIS_DB: "0"
    volumes:
      - bastion-redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  bastion-redis-data:
  bastion-redisinsight-data:
